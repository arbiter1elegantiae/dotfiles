# Skip first-run setup.
onboarding = false

[theme]
# Follow the host terminal's color palette.
name = "terminal"

[theme.custom]
# Keep active-tab text dark for contrast against its accent background.
panel_bg = "black"
# Give the selected sidebar row a distinct highlight in Navigate mode.
selection_bg = "#2d3650"

[terminal]
# New panes, tabs, and workspaces inherit the source working directory.
new_cwd = "follow"

[keys]
# prefix+... means press Ctrl+B, then the indicated key combination.
prefix = "ctrl+b"

# Reload settings, show keybindings, or detach while panes keep running.
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Enter copy mode to select and copy pane output.
copy_mode = "prefix+["

# Split horizontally (stacked) or vertically (side by side).
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]

# Close or zoom the focused pane, or return to the last focused pane.
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

# Move focus directly between panes.
focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

# Enter resize mode with the prefix followed by Ctrl+an arrow key.
resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Resize the focused pane directly, without entering resize mode.
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# Rename the focused pane.
rename_pane = "prefix+shift+o"

# Create, rename, close, or select tabs in the current workspace.
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Move the current tab earlier or later in the tab order.
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Create, rename, close, or cycle through workspaces.
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
# Use blue accents for UI highlights.
accent = "blue"

# Share dividers between adjacent panes without an outer frame.
pane_gaps = false
pane_outer_borders = false

# Hide pane scrollbars to leave more columns for terminal content.
pane_scrollbars = false

# Create tabs without prompting for a name.
prompt_new_tab_name = false

# Let Herdr handle mouse input for its interface.
mouse_capture = true

# Show the zoom indicator and server hostname at the right of the tab bar.
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# Set the outer terminal title to the server hostname and current workspace.
window_title = "{hostname}: {workspace}"
